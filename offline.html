<!DOCTYPE html>
<html lang="en-NZ">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline | CartCure NZ</title>
    <link rel="icon" type="image/webp" href="CartCure_Favicon_compressed.webp">
    <link rel="icon" type="image/png" href="CartCure_Favicon_compressed.png">
    <style>
        :root {
            --paper-white: #fdfcfa;
            --paper-cream: #f8f6f1;
            --ink-black: #2b2b2b;
            --ink-gray: #5a5a5a;
            --accent-green: #2d5d3f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: var(--paper-cream);
            color: var(--ink-black);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }

        .offline-container {
            max-width: 500px;
            background: var(--paper-white);
            padding: 3rem 2rem;
            border: 2px solid #e8e4dc;
            box-shadow: 4px 4px 0px rgba(0, 0, 0, 0.05);
        }

        .offline-icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: 1.75rem;
            margin-bottom: 1rem;
            color: var(--ink-black);
        }

        p {
            color: var(--ink-gray);
            line-height: 1.7;
            margin-bottom: 1.5rem;
        }

        .retry-button {
            display: inline-block;
            padding: 0.875rem 2rem;
            font-size: 1rem;
            font-weight: 700;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--accent-green);
            color: white;
            border: 3px solid var(--ink-black);
            cursor: pointer;
            box-shadow: 4px 4px 0px rgba(43, 43, 43, 0.3);
            text-decoration: none;
            transition: all 0.2s;
        }

        .retry-button:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px rgba(43, 43, 43, 0.3);
        }

        .home-link {
            display: block;
            margin-top: 1.5rem;
            color: var(--accent-green);
            text-decoration: none;
            font-weight: 600;
        }

        .home-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .offline-container {
                padding: 2rem 1.5rem;
            }

            h1 {
                font-size: 1.5rem;
            }

            .offline-icon {
                font-size: 3rem;
            }
        }
    </style>
</head>

<body>
    <div class="offline-container">
        <div class="offline-icon">📡</div>
        <h1>You're Offline</h1>
        <p>It looks like you've lost your internet connection. Please check your connection and try again.</p>
        <button class="retry-button" onclick="window.location.reload()">Try Again</button>
        <a href="/" class="home-link">Go to Homepage</a>
    </div>
</body>

</html>
