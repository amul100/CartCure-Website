<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body style="margin:0; padding:0; font-family:Arial, sans-serif; font-size:10pt;">

<table width="600" cellpadding="0" cellspacing="0" border="0" align="center">

  <!-- Logo -->
  <tr>
    <td align="center" style="padding:8px 0;">
      <img src="https://cartcure.co.nz/CartCure_fullLogo.png" alt="CartCure" width="130" style="width:130px;">
    </td>
  </tr>

  <!-- Title Bar -->
  <tr>
    <td bgcolor="<?= colors.brandGreen ?>" align="center" style="padding:10px;">
      <font color="#ffffff" size="5"><b><?= headingTitle ?></b></font><br>
      <font color="#dddddd" size="1"><?= invoiceNumber ?> &middot; Job: <?= jobNumber ?></font>
    </td>
  </tr>

  <!-- Deposit Notice -->
  <? if (depositNoticeHtml) { ?>
  <tr><td><?!= depositNoticeHtml ?></td></tr>
  <? } ?>

  <!-- Greeting -->
  <tr>
    <td align="left" style="padding:6px 0;">
      <b>To:</b> <?= clientName ?><br>
      <?= greetingText ?>
    </td>
  </tr>

  <!-- Invoice Details -->
  <tr>
    <td align="left" style="padding:4px 0 2px 0;">
      <b><font size="2">INVOICE DETAILS</font></b>
    </td>
  </tr>
  <tr><td bgcolor="<?= colors.paperBorder ?>" height="1" style="font-size:1px; line-height:1px;">&nbsp;</td></tr>
  <tr>
    <td style="padding:4px 0;">
      <table width="100%" cellpadding="6" cellspacing="3" border="0">
        <tr>
          <td width="48%" bgcolor="<?= colors.paperCream ?>" style="border:1px solid <?= colors.paperBorder ?>;">
            <font size="1" color="<?= colors.inkGray ?>">INVOICE DATE</font><br>
            <b><font size="3" color="<?= colors.brandGreen ?>"><?= invoiceDate ?></font></b>
          </td>
          <td width="48%" bgcolor="<?= colors.paperCream ?>" style="border:1px solid <?= colors.paperBorder ?>;">
            <font size="1" color="<?= colors.inkGray ?>">DUE DATE</font><br>
            <b><font size="3" color="<?= colors.brandGreen ?>"><?= dueDate ?></font></b>
          </td>
        </tr>
      </table>
    </td>
  </tr>

  <!-- Amount Due -->
  <tr>
    <td align="left" style="padding:4px 0 2px 0;">
      <b><font size="2">AMOUNT DUE</font></b>
    </td>
  </tr>
  <tr><td bgcolor="<?= colors.paperBorder ?>" height="1" style="font-size:1px; line-height:1px;">&nbsp;</td></tr>
  <tr>
    <td style="padding:4px 0;">
      <?!= pricingRowsHtml ?>
    </td>
  </tr>

  <!-- Payment Details -->
  <tr>
    <td style="padding:4px 0;">
      <table width="100%" cellpadding="8" cellspacing="0" border="0">
        <tr>
          <td bgcolor="<?= colors.alertBg ?>" align="left" style="border:2px solid <?= colors.alertBorder ?>;">
            <b>Payment Details:</b><br>
            <font size="2" color="<?= colors.inkGray ?>">
              <?!= bankDetailsHtml ?>
              <b>Reference:</b> <?= invoiceNumber ?>
            </font>
          </td>
        </tr>
      </table>
    </td>
  </tr>

  <!-- Footer -->
  <tr>
    <td bgcolor="<?= colors.paperBorder ?>" height="1" style="font-size:1px; line-height:1px;">&nbsp;</td>
  </tr>
  <tr>
    <td align="center" style="padding:6px 0;">
      <font size="1" color="<?= colors.inkLight ?>">
        Questions? Email us at hello@cartcure.co.nz<br>
        <?= businessName ?> | Quick Shopify Fixes for NZ Businesses<br>
        <?!= gstFooterLine ?>
        cartcure.co.nz
      </font>
    </td>
  </tr>

</table>

</body>
</html>
