<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body style="margin:0; padding:0; background-color:#ffffff; color:#2b2b2b; font-family:Arial, Helvetica, sans-serif; font-size:11pt; line-height:1.4;">

<table width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px; margin:0 auto;">

  <!-- Logo -->
  <tr>
    <td align="center" style="padding:15px 0; border-bottom:2px solid <?= colors.paperBorder ?>;">
      <img src="https://cartcure.co.nz/CartCure_fullLogo.png" alt="CartCure" width="150" style="width:150px; height:auto;">
    </td>
  </tr>

  <!-- Title Bar -->
  <tr>
    <td style="background-color:<?= colors.brandGreen ?>; padding:16px; text-align:center; color:#ffffff;">
      <h1 style="margin:0 0 4px 0; font-size:22pt; font-weight:bold; font-family:Georgia,'Times New Roman',serif; color:#ffffff;"><?= headingTitle ?></h1>
      <p style="margin:0; font-size:10pt; color:#ffffffcc;"><?= invoiceNumber ?> &middot; Job: <?= jobNumber ?></p>
    </td>
  </tr>

  <!-- Deposit Notice (if applicable) -->
  <? if (depositNoticeHtml) { ?>
  <tr>
    <td style="padding:0;">
      <?!= depositNoticeHtml ?>
    </td>
  </tr>
  <? } ?>

  <!-- Greeting -->
  <tr>
    <td style="padding:12px 0;">
      <p style="margin:0; font-size:11pt; line-height:1.5;">
        <strong>To:</strong> <?= clientName ?><br>
        <?= greetingText ?>
      </p>
    </td>
  </tr>

  <!-- Invoice Details Header -->
  <tr>
    <td style="padding:10px 0 6px 0; border-bottom:2px solid <?= colors.paperBorder ?>;">
      <strong style="font-size:10pt; text-transform:uppercase; letter-spacing:1px; color:#2b2b2b;">Invoice Details</strong>
    </td>
  </tr>

  <!-- Dates -->
  <tr>
    <td style="padding:8px 0;">
      <table width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr>
          <td width="48%" style="background-color:<?= colors.paperCream ?>; border:1px solid <?= colors.paperBorder ?>; padding:10px; vertical-align:top;">
            <div style="font-size:8pt; text-transform:uppercase; color:<?= colors.inkGray ?>; margin-bottom:3px;">Invoice Date</div>
            <div style="font-size:13pt; font-weight:bold; color:<?= colors.brandGreen ?>;"><?= invoiceDate ?></div>
          </td>
          <td width="4%"></td>
          <td width="48%" style="background-color:<?= colors.paperCream ?>; border:1px solid <?= colors.paperBorder ?>; padding:10px; vertical-align:top;">
            <div style="font-size:8pt; text-transform:uppercase; color:<?= colors.inkGray ?>; margin-bottom:3px;">Due Date</div>
            <div style="font-size:13pt; font-weight:bold; color:<?= colors.brandGreen ?>;"><?= dueDate ?></div>
          </td>
        </tr>
      </table>
    </td>
  </tr>

  <!-- Amount Due Header -->
  <tr>
    <td style="padding:10px 0 6px 0; border-bottom:2px solid <?= colors.paperBorder ?>;">
      <strong style="font-size:10pt; text-transform:uppercase; letter-spacing:1px; color:#2b2b2b;">Amount Due</strong>
    </td>
  </tr>

  <!-- Pricing Table -->
  <tr>
    <td style="padding:8px 0;">
      <table width="100%" cellpadding="0" cellspacing="0" border="0" style="border:1px solid <?= colors.paperBorder ?>; border-collapse:collapse;">
        <?!= pricingRowsHtml ?>
      </table>
    </td>
  </tr>

  <!-- Payment Details -->
  <tr>
    <td style="padding:8px 0;">
      <table width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr>
          <td style="background-color:<?= colors.alertBg ?>; border:2px solid <?= colors.alertBorder ?>; padding:12px;">
            <p style="margin:0 0 6px 0; font-weight:bold; color:#2b2b2b;">Payment Details:</p>
            <p style="margin:0; font-size:10pt; color:<?= colors.inkGray ?>; line-height:1.5;">
              <?!= bankDetailsHtml ?>
              <strong>Reference:</strong> <?= invoiceNumber ?>
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>

  <!-- Footer -->
  <tr>
    <td style="padding:15px 0 0 0; border-top:2px solid <?= colors.paperBorder ?>; text-align:center; font-size:9pt; color:<?= colors.inkLight ?>; line-height:1.5;">
      <p style="margin:0;">
        Questions? Email us at hello@cartcure.co.nz<br>
        <?= businessName ?> | Quick Shopify Fixes for NZ Businesses<br>
        <?!= gstFooterLine ?>
        cartcure.co.nz
      </p>
    </td>
  </tr>

</table>

</body>
</html>
