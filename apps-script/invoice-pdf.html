<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    @page {
      size: A4;
      margin: 15mm;
    }
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      color: <?= colors.inkBlack ?>;
      font-size: 12pt;
      line-height: 1.4;
    }
    .invoice-container {
      max-width: 100%;
      margin: 0 auto;
      background-color: #ffffff;
    }
    .header {
      text-align: center;
      padding: 20px 0;
      border-bottom: 2px solid <?= colors.paperBorder ?>;
    }
    .logo {
      max-width: 150px;
      height: auto;
    }
    .invoice-title-bar {
      background-color: <?= colors.brandGreen ?>;
      padding: 20px;
      text-align: center;
      color: #ffffff;
    }
    .invoice-title {
      margin: 0 0 5px 0;
      font-size: 24pt;
      font-weight: bold;
      font-family: Georgia, 'Times New Roman', serif;
    }
    .invoice-refs {
      margin: 0;
      font-size: 10pt;
      opacity: 0.9;
    }
    .section {
      padding: 15px 0;
    }
    .section-title {
      font-size: 11pt;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: <?= colors.inkBlack ?>;
      border-bottom: 2px solid <?= colors.paperBorder ?>;
      padding-bottom: 8px;
      margin-bottom: 12px;
    }
    .greeting {
      font-size: 12pt;
      line-height: 1.6;
      margin-bottom: 15px;
    }
    .dates-grid {
      display: table;
      width: 100%;
      border-collapse: separate;
      border-spacing: 10px 0;
    }
    .date-box {
      display: table-cell;
      width: 48%;
      background-color: <?= colors.paperCream ?>;
      border: 1px solid <?= colors.paperBorder ?>;
      padding: 12px;
      vertical-align: top;
    }
    .date-label {
      font-size: 9pt;
      text-transform: uppercase;
      color: <?= colors.inkGray ?>;
      margin-bottom: 4px;
    }
    .date-value {
      font-size: 14pt;
      font-weight: bold;
      color: <?= colors.brandGreen ?>;
    }
    .pricing-table {
      width: 100%;
      border-collapse: collapse;
      background-color: <?= colors.paperCream ?>;
      border: 1px solid <?= colors.paperBorder ?>;
    }
    .pricing-table td {
      padding: 10px 12px;
      border-bottom: 1px solid <?= colors.paperBorder ?>;
    }
    .pricing-label {
      color: <?= colors.inkGray ?>;
    }
    .pricing-value {
      text-align: right;
      font-weight: bold;
      color: <?= colors.inkBlack ?>;
    }
    .pricing-total {
      background-color: <?= colors.brandGreen ?>;
    }
    .pricing-total td {
      color: #ffffff;
      font-weight: bold;
      padding: 12px;
      border-bottom: none;
    }
    .pricing-total .pricing-value {
      color: #ffffff;
      font-size: 16pt;
    }
    .payment-details {
      background-color: <?= colors.alertBg ?>;
      border: 2px solid <?= colors.alertBorder ?>;
      padding: 15px;
      margin-top: 15px;
    }
    .payment-title {
      font-weight: bold;
      margin-bottom: 8px;
      color: <?= colors.inkBlack ?>;
    }
    .payment-info {
      font-size: 11pt;
      color: <?= colors.inkGray ?>;
      line-height: 1.6;
    }
    .footer {
      margin-top: 25px;
      padding-top: 15px;
      border-top: 2px solid <?= colors.paperBorder ?>;
      text-align: center;
      font-size: 9pt;
      color: <?= colors.inkLight ?>;
      line-height: 1.6;
    }
    .deposit-notice {
      background-color: <?= colors.alertBg ?>;
      border: 2px dashed <?= colors.alertBorder ?>;
      padding: 12px;
      margin: 15px 0;
      text-align: center;
    }
    .deposit-notice strong {
      color: <?= colors.brandGreen ?>;
    }
  </style>
</head>
<body>
  <div class="invoice-container">

    <!-- Header with Logo -->
    <div class="header">
      <img src="https://cartcure.co.nz/CartCure_fullLogo.png" alt="CartCure" class="logo">
    </div>

    <!-- Invoice Title Bar -->
    <div class="invoice-title-bar">
      <h1 class="invoice-title"><?= headingTitle ?></h1>
      <p class="invoice-refs"><?= invoiceNumber ?> &middot; Job: <?= jobNumber ?></p>
    </div>

    <?!= depositNoticeHtml ?>

    <!-- Greeting -->
    <div class="section">
      <p class="greeting">
        <strong>To:</strong> <?= clientName ?><br>
        <?= greetingText ?>
      </p>
    </div>

    <!-- Invoice Details -->
    <div class="section">
      <h2 class="section-title">Invoice Details</h2>
      <div class="dates-grid">
        <div class="date-box">
          <div class="date-label">Invoice Date</div>
          <div class="date-value"><?= invoiceDate ?></div>
        </div>
        <div class="date-box">
          <div class="date-label">Due Date</div>
          <div class="date-value"><?= dueDate ?></div>
        </div>
      </div>
    </div>

    <!-- Pricing -->
    <div class="section">
      <h2 class="section-title">Amount Due</h2>
      <table class="pricing-table">
        <?!= pricingRowsHtml ?>
      </table>
    </div>

    <!-- Payment Details -->
    <div class="payment-details">
      <p class="payment-title">Payment Details:</p>
      <p class="payment-info">
        <?!= bankDetailsHtml ?>
        <strong>Reference:</strong> <?= invoiceNumber ?>
      </p>
    </div>

    <!-- Footer -->
    <div class="footer">
      <p>
        Questions? Email us at hello@cartcure.co.nz<br>
        <?= businessName ?> | Quick Shopify Fixes for NZ Businesses<br>
        <?!= gstFooterLine ?>
        cartcure.co.nz
      </p>
    </div>

  </div>
</body>
</html>
